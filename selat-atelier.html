<!--
  ============================================================
  SINGAPORE SHOPPING — Parangipettai, Cuddalore
  High-End Luxury Atelier — Production Build
  ============================================================
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08080C">
<title>Singapore Shopping — Parangipettai, Cuddalore</title>

<!-- High-Fashion Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
/* ================= LUXURY DESIGN SYSTEM ================= */
:root {
  /* Dark Obsidian Theme (Default) */
  --bg-ground: #08080c;
  --bg-panel: rgba(18, 19, 26, 0.8);
  --bg-panel-hover: rgba(28, 30, 42, 0.9);
  --bg-raise: #141620;
  --text-main: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --border-rule: rgba(255, 255, 255, 0.08);
  --border-glow: rgba(255, 42, 84, 0.4);

  --accent-red: #ff2a54;
  --accent-red-soft: #d90032;
  --accent-red-line: rgba(255, 42, 84, 0.45);
  --accent-red-glow: rgba(255, 42, 84, 0.2);
  --accent-gold: #e6b953;
  --accent-teal: #00f2fe;
  --accent-emerald: #10b981;

  --glass-bg: rgba(15, 16, 23, 0.78);
  --glass-border: 1px solid rgba(255, 255, 255, 0.1);
  --glass-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 42, 84, 0.08);

  --font-display: "Syne", "Outfit", sans-serif;
  --font-heading: "Outfit", sans-serif;
  --font-body: "Plus Jakarta Sans", sans-serif;
  --font-mono: "JetBrains Mono", monospace;

  --gutter: clamp(16px, 4vw, 64px);
  --stack: clamp(56px, 8vw, 120px);
  --ease: cubic-bezier(.22, .61, .28, 1);
  --slow: cubic-bezier(.16, 1, .3, 1);
  --spring: cubic-bezier(.175, .885, .32, 1.275);
  --header-h: 70px;
}

[data-theme="light"] {
  --bg-ground: #f8fafc;
  --bg-panel: rgba(255, 255, 255, 0.88);
  --bg-panel-hover: rgba(241, 245, 249, 0.95);
  --bg-raise: #e2e8f0;
  --text-main: #0f172a;
  --text-dim: #475569;
  --text-muted: #64748b;
  --border-rule: rgba(0, 0, 0, 0.08);
  --border-glow: rgba(255, 42, 84, 0.35);
  --accent-red-glow: rgba(255, 42, 84, 0.08);
  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-border: 1px solid rgba(0, 0, 0, 0.09);
  --glass-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.12);
}

/* Global Reset & Touch Optimization */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html, body { width: 100%; overflow-x: hidden; }
body {
  background-color: var(--bg-ground);
  color: var(--text-main);
  font: 400 15px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  position: relative;
  transition: background-color .35s ease, color .35s ease;
}

body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-red);outline-offset:3px}
::selection{background:var(--accent-red);color:#ffffff}

/* Ambient glow blob */
#bgGlowBlob {
  position: fixed;
  width: min(500px, 90vw);
  height: min(500px, 90vw);
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-red-glow) 0%, rgba(0,242,254,0.03) 55%, transparent 75%);
  pointer-events: none;
  z-index: 0;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  filter: blur(50px);
  transition: transform 0.25s ease-out;
}

/* Headings & Typography */
h1, h2, h3 { font-family: var(--font-heading); font-weight: 700; line-height: 1.08; letter-spacing: -0.025em; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(34px, 7vw, 92px);
  letter-spacing: -0.035em;
  background: linear-gradient(135deg, var(--text-main) 35%, var(--text-dim) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
h1 .glow-text {
  background: linear-gradient(135deg, #ff2a54 0%, #ff7593 50%, #e6b953 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
}
h2 { font-size: clamp(24px, 4vw, 44px); letter-spacing: -0.025em; }
h3 { font-size: clamp(16px, 1.8vw, 20px); font-weight: 600; }
p { max-width: 60ch; color: var(--text-dim); }

.mono {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}

/* Glassmorphic Header */
header {
  position: fixed;
  inset: 0 0 auto;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px var(--gutter);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: var(--glass-border);
  height: var(--header-h);
  transition: border-color .35s, transform .4s var(--ease);
}
header.stuck { border-bottom-color: var(--border-glow); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

.brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(18px, 4.5vw, 22px);
  letter-spacing: -0.02em;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.brand .rp { color: var(--accent-red); }

nav {
  display: flex;
  gap: 10px;
  align-items: center;
}
.nav-links-desktop { display: flex; gap: 16px; align-items: center; }
nav a, .util-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  transition: all .25s var(--ease);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  min-height: 40px;
  border-radius: 8px;
  border: 1px solid transparent;
}
nav a:hover, nav a.on, .util-btn:hover {
  color: var(--text-main);
  background: var(--bg-raise);
  border-color: var(--border-rule);
}
.cart-badge-btn {
  background: var(--accent-red);
  color: #ffffff !important;
  font-weight: 600;
  border-radius: 10px;
  padding: 8px 16px;
  min-height: 40px;
  box-shadow: 0 4px 15px var(--accent-red-glow);
  transition: transform 0.2s var(--spring);
}
.cart-badge-btn:active { transform: scale(0.95); }

.mobile-menu-btn {
  display: none;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--bg-raise);
  border: 1px solid var(--border-rule);
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

/* Mobile Slide Drawer Navigation */
.mobile-nav-drawer {
  position: fixed;
  inset: var(--header-h) 0 0 0;
  z-index: 99;
  background: var(--bg-ground);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.4s var(--slow), opacity 0.3s ease;
  border-bottom: var(--glass-border);
}
.mobile-nav-drawer.open {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
.mobile-nav-drawer a {
  font-family: var(--font-heading);
  font-size: 20px;
  font-weight: 600;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-rule);
}

main { padding-top: var(--header-h); position: relative; z-index: 1; }

/* Mobile-First Responsive Filter & Search Bar */
.filter-bar {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 32px;
  padding: 16px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  border: var(--glass-border);
  border-radius: 20px;
}
@media (min-width: 680px) {
  .filter-bar {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
}
.filter-pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.filter-pills::-webkit-scrollbar { display: none; }

.pill {
  padding: 10px 18px;
  min-height: 42px;
  border-radius: 30px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--bg-raise);
  border: 1px solid var(--border-rule);
  color: var(--text-dim);
  transition: all 0.25s var(--ease);
  flex: none;
}
.pill.active {
  background: var(--accent-red);
  color: #ffffff;
  border-color: var(--accent-red);
  box-shadow: 0 4px 15px var(--accent-red-glow);
}

.search-box {
  position: relative;
  width: 100%;
}
@media (min-width: 680px) {
  .search-box { max-width: 300px; }
}
.search-box input {
  width: 100%;
  min-height: 44px;
  padding: 10px 16px 10px 40px;
  border-radius: 30px;
  background: var(--bg-raise);
  border: 1px solid var(--border-rule);
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s ease;
}
.search-box input:focus { border-color: var(--accent-red); }
.search-box svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  fill: none;
  stroke: var(--text-muted);
  stroke-width: 2;
}

/* Animations */
.rv { opacity: 0; transform: translateY(20px); }
.rv.in { opacity: 1; transform: none; transition: opacity 0.7s var(--ease), transform 0.7s var(--slow); }

/* 3D Stage & Object Rendering */
.obj {
  position: relative;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform .5s var(--slow);
}
.face {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  box-shadow: var(--glass-shadow);
  border-radius: 14px;
  backface-visibility: hidden;
  overflow: hidden;
  border: var(--glass-border);
}
.face::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 100%);
  pointer-events: none;
  opacity: 0.5;
}
.face.back { transform: rotateY(180deg) scaleX(-1); }
.shadow {
  position: absolute;
  left: 50%;
  bottom: -11%;
  width: 70%;
  height: 20px;
  translate: -50% 0;
  background: radial-gradient(ellipse, rgba(0,0,0,0.7), transparent 70%);
  filter: blur(8px);
  pointer-events: none;
}

/* Hero Section — Mobile Optimized */
.hero {
  padding: clamp(24px, 4vw, 60px) var(--gutter) clamp(32px, 5vw, 60px);
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
  align-items: center;
}
@media (min-width: 860px) {
  .hero { grid-template-columns: 1.05fr .95fr; gap: 56px; }
}
.hero .mono { margin-bottom: 16px; color: var(--accent-red); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.hero .mono::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
.hero h1 { margin-bottom: 20px; }
.hero p { color: var(--text-dim); margin-bottom: 28px; font-size: 15.5px; }

.heroStage {
  width: 100%;
  max-width: 340px;
  margin: 0 auto;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  perspective: 1500px;
  background: radial-gradient(circle at 50% 50%, var(--accent-red-glow), transparent 70%), var(--glass-bg);
  border: var(--glass-border);
  border-radius: 24px;
  cursor: grab;
  touch-action: pan-y;
  position: relative;
  box-shadow: var(--glass-shadow);
}
.heroStage.drag { cursor: grabbing; }
.stagehint {
  position: absolute;
  left: 50%;
  bottom: 12px;
  translate: -50% 0;
  pointer-events: none;
  background: var(--bg-raise);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid var(--border-rule);
  white-space: nowrap;
}

/* Buttons */
.ul {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 0;
  position: relative;
}
.ul::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 2px;
  height: 1.5px;
  width: 100%;
  background: currentColor;
  transform-origin: right;
  transition: transform .35s var(--slow);
}
.ul:hover::after { transform: scaleX(0); transform-origin: left; }

.solid {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  min-height: 48px;
  background: var(--accent-red);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 6px 20px var(--accent-red-glow);
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.solid:active { transform: scale(0.97); }
.solid.wide { display: flex; width: 100%; text-align: center; }

/* Grid & Cards — Mobile-First 100% Fit */
section { padding: 0 var(--gutter) var(--stack); }
.head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-rule);
  margin-bottom: clamp(24px, 3.5vw, 40px);
}

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
@media (min-width: 520px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
}

.card {
  position: relative;
  background: var(--glass-bg);
  border: var(--glass-border);
  border-radius: 20px;
  padding: 16px;
  transition: transform 0.35s var(--spring), border-color 0.35s ease;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--border-glow);
}
.card .cell {
  aspect-ratio: 1;
  max-height: 280px;
  margin: 0 auto;
  display: grid;
  place-items: center;
  perspective: 900px;
  overflow: hidden;
  border-radius: 14px;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03), transparent 70%);
}
.card .meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  align-items: flex-start;
}
.card h3 { font-family: var(--font-heading); color: var(--text-main); }
.card .origin { margin-top: 4px; font-size: 10.5px; }
.card .price {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 16px;
  white-space: nowrap;
  color: var(--pc, var(--accent-red));
}
.card .card-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border-rule);
}

/* Statement section */
.statement {
  padding: clamp(40px, 7vw, 90px) var(--gutter);
  border-top: 1px solid var(--border-rule);
  border-bottom: 1px solid var(--border-rule);
  background: radial-gradient(circle at 50% 50%, var(--accent-red-glow), transparent 65%);
}
.statement p {
  font-family: var(--font-display);
  font-size: clamp(20px, 4.5vw, 38px);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
  max-width: 26ch;
  margin: 0 auto;
  text-align: center;
}
.statement p w { transition: color .3s linear; color: var(--text-muted); opacity: 0.35; }
.statement p w.lit { color: var(--text-main); opacity: 1; text-shadow: 0 0 16px var(--accent-red-glow); }

/* Origin Map Wrapper — High Resolution Singapore Visualiser */
.mapwrap {
  position: relative;
  border: var(--glass-border);
  background: var(--glass-bg);
  border-radius: 20px;
  padding: clamp(14px, 2.5vw, 24px);
  box-shadow: var(--glass-shadow);
  overflow: hidden;
}
#map { width: 100%; height: auto; display: block; border-radius: 12px; }

.pin {
  position: absolute;
  width: 16px;
  height: 16px;
  translate: -50% -50%;
  border-radius: 50%;
  border: 2px solid var(--text-main);
  background: var(--bg-ground);
  cursor: pointer;
  z-index: 10;
  transition: transform .3s var(--spring);
}
.pin::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 50%;
  background: var(--pc, var(--accent-red));
  box-shadow: 0 0 10px var(--pc, var(--accent-red));
}
.pin:active, .pin.on { transform: translate(-50%, -50%) scale(1.6); }

/* Mobile Pin Card Toast */
.mobile-pin-toast {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 16px;
  z-index: 20;
  background: var(--bg-panel);
  backdrop-filter: blur(16px);
  border: var(--glass-border);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transform: translateY(120%);
  transition: transform 0.35s var(--spring);
}
.mobile-pin-toast.open { transform: translateY(0); }

/* Product Details Page (PDP) */
.pdp {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
  padding: clamp(20px, 4vw, 48px) var(--gutter) var(--stack);
}
@media (min-width: 860px) {
  .pdp { grid-template-columns: 1.04fr .96fr; gap: 64px; }
  .stage { position: sticky; top: calc(var(--header-h) + 24px); }
}

.bigStage {
  aspect-ratio: 1;
  max-height: 420px;
  margin: 0 auto;
  display: grid;
  place-items: center;
  perspective: 1600px;
  cursor: grab;
  touch-action: pan-y;
  position: relative;
  overflow: hidden;
  background: var(--glass-bg);
  border: var(--glass-border);
  border-radius: 24px;
}
.stagebar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 14px; }

.pdp h2 { font-size: clamp(26px, 4vw, 46px); margin-bottom: 14px; }
.pdp .lede { font-size: 16px; margin-bottom: 16px; color: var(--text-main); }
.pdp .body { color: var(--text-dim); margin-bottom: 24px; }
.pdp .price { font-size: 28px; font-family: var(--font-mono); font-weight: 600; color: var(--pc, var(--accent-red)); margin-bottom: 6px; }

.buyrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.qty {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border-rule);
  border-radius: 10px;
  background: var(--bg-raise);
  min-height: 48px;
}
.qty button { width: 44px; height: 48px; font-weight: 600; font-size: 18px; }
.qty i { font-style: normal; min-width: 36px; text-align: center; font-family: var(--font-mono); }

.specs { margin-top: 36px; border-top: 1px solid var(--border-rule); }
.specs div {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-rule);
  font-size: 13.5px;
}

/* Quick View Modal — Mobile Sheet Optimized */
.modal-scrim {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: end center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s var(--ease);
}
@media (min-width: 640px) {
  .modal-scrim { place-items: center; }
}
.modal-scrim.open { opacity: 1; pointer-events: auto; }

.modal-card {
  width: 100%;
  max-width: 760px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--bg-ground);
  border: var(--glass-border);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px;
  position: relative;
  transform: translateY(100%);
  transition: transform 0.4s var(--spring);
}
@media (min-width: 640px) {
  .modal-card { border-radius: 24px; transform: scale(0.92); }
  .modal-scrim.open .modal-card { transform: scale(1); }
}
.modal-scrim.open .modal-card { transform: translateY(0); }

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg-raise);
  border: 1px solid var(--border-rule);
  display: grid;
  place-items: center;
  font-size: 18px;

/* Sound Synthesizer */
class UISoundSynthesizer {
  constructor() { this.ctx = null; this.enabled = true; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  }
  playTone(freq = 600, duration = 0.05) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch(e){}
  }
  playSuccess() {
    if (!this.enabled) return;
    this.playTone(523, 0.07);
    setTimeout(() => this.playTone(659, 0.07), 60);
    setTimeout(() => this.playTone(784, 0.1), 120);
  }
}

const cache = {};
function wrapper(p, size = 600){
  if(p.photo) return `url('${p.photo}')`;
  if(cache[p.id]) return cache[p.id];
  const [base, ink, accent] = p.palette;
  const c = document.createElement("canvas");

  x.fillStyle = base; x.fillRect(0,0,W,H);
  x.fillStyle = ink; x.globalAlpha = 0.92; x.fillRect(0, H*0.4, W, H*0.2);
  x.globalAlpha = 1; x.strokeStyle = accent; x.lineWidth = 3;

  x.fillText(SITE.brand.toUpperCase(), W/2, H*0.5);

  return cache[p.id] = `url('${c.toDataURL("image/jpeg", .88)}')`;
}

function grip(stage, opts = {}){
  const obj = stage.querySelector("[data-obj]");
  if(!obj) return;
  let ry = opts.ry ?? -20, rx = opts.rx ?? 8, down = false, lx = 0, v = 0, touched = false;
  const paint = () => {
    obj.style.transition = down ? "none" : "transform .5s var(--slow)";
    obj.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    const t = Math.abs(Math.cos(ry * Math.PI / 180));
    const sh = obj.querySelector(".shadow");
    if(sh){ sh.style.transform = `scaleX(${.55 + t * .45})`; sh.style.opacity = .45 + t * .55; }
  };
  const loop = () => {
    if(!down){
      if(Math.abs(v) > .02){ ry += v; v *= .94; paint(); }
      else if(!touched && !reduce && opts.idle !== false){ ry += .16; paint(); }
    }
    requestAnimationFrame(loop);
  };
  const down_ = px => { down = true; touched = true; lx = px; v = 0; stage.classList.add("drag"); sound.playTone(400, 0.03); };
  const move_ = px => { if(!down) return; v = (px - lx) * .35; ry += v; lx = px; paint(); };
  const up_ = () => { down = false; stage.classList.remove("drag"); };

  stage.addEventListener("mousedown", e => { e.preventDefault(); down_(e.clientX); });
  window.addEventListener("mousemove", e => move_(e.clientX));
  window.addEventListener("mouseup", up_);
  stage.addEventListener("touchstart", e => down_(e.touches[0].clientX), {passive:true});
  stage.addEventListener("touchmove",  e => move_(e.touches[0].clientX), {passive:true});
  stage.addEventListener("touchend", up_);
  paint(); loop();
  return obj;
}

/* High-DPI Detailed Singapore Island & Logistics Map Visualiser */
let mapAnimId = null;
let particleStep = 0;

function paintMap(){
  const c = document.getElementById("map"); if(!c) return;
  const x = c.getContext("2d"), W = c.width, H = c.height;

  const draw = () => {
    x.clearRect(0,0,W,H);
    particleStep = (particleStep + 0.35) % 24;

    /* Background Water Grid */
    x.fillStyle = "rgba(255,255,255,0.04)";
    for(let gy = 0; gy < H; gy += 24)
      for(let gx = 0; gx < W; gx += 24) x.fillRect(gx, gy, 1.5, 1.5);

    /* Detailed Singapore Main Island Polygon */
    const sgMain = [
      [.08,.44],[.11,.32],[.16,.25],[.24,.20],[.34,.20],[.42,.22],[.48,.26],
      [.54,.30],[.58,.38],[.54,.48],[.46,.54],[.38,.58],[.28,.62],[.18,.58],[.10,.50]
    ];

    /* Sentosa Island Polygon */
    const sentosa = [[.26,.66],[.32,.66],[.34,.70],[.28,.70]];

    /* Pulau Tekong Polygon */
    const tekong = [[.58,.22],[.64,.22],[.65,.28],[.60,.28]];

    /* Tamil Nadu Coast Silhouette (Right side) */
    const tnCoast = [[.80,.05],[.84,.15],[.86,.30],[.84,.50],[.88,.70],[.85,.95],[.95,.95],[.95,.05]];

    /* Render Landmasses */
    [sgMain, sentosa, tekong, tnCoast].forEach((shape, idx) => {
      x.beginPath();
      shape.forEach(([px,py], i) => i ? x.lineTo(px*W, py*H) : x.moveTo(px*W, py*H));
      x.closePath();

      const g = x.createLinearGradient(0,0,W,H);
      if (idx < 3) {
        g.addColorStop(0,"rgba(255,42,84,0.18)");
        g.addColorStop(1,"rgba(230,185,83,0.12)");
      } else {
        g.addColorStop(0,"rgba(0,242,254,0.08)");
        g.addColorStop(1,"rgba(255,255,255,0.04)");
      }
      x.fillStyle = g; x.fill();
      x.strokeStyle = "rgba(255,255,255,0.3)"; x.lineWidth = 2; x.stroke();
    });

    /* Map Labels */
    x.fillStyle = "rgba(255,255,255,0.85)";
    x.font = '700 20px "Syne", sans-serif';
    x.fillText("SINGAPORE ISLAND", W * .14, H * .14);
    x.font = '500 13px "JetBrains Mono", monospace';
    x.fillStyle = "rgba(255,42,84,0.8)";
    x.fillText("MAIN SOURCING HUB", W * .14, H * .18);

    x.fillStyle = "rgba(255,255,255,0.75)";
    x.font = '600 16px "Syne", sans-serif';
    x.fillText("PARANGIPETTAI PORT", W * .72, H * .46);
    x.font = '400 12px "JetBrains Mono", monospace';
    x.fillStyle = "rgba(148,163,184,0.8)";
    x.fillText("CUDDALORE, TAMIL NADU", W * .72, H * .50);

    /* Shipping Route Lines from Singapore to Parangipettai */
    const destX = W * .82, destY = H * .52;
    ESTATES.forEach(e => {
      const sx = e.x / 100 * W, sy = e.y / 100 * H;
      x.beginPath();
      x.moveTo(sx, sy);
      x.lineTo(destX, destY);
      x.strokeStyle = "rgba(255,42,84,0.22)";
      x.lineWidth = 1.5;
      x.setLineDash([4, 6]);
      x.lineDashOffset = -particleStep;
      x.stroke();
    });
    x.setLineDash([]);

    /* Destination Pulse Marker */
    x.beginPath(); x.arc(destX, destY, 8, 0, Math.PI*2);
    x.fillStyle = "#FF2A54"; x.fill();
    x.beginPath(); x.arc(destX, destY, 16, 0, Math.PI*2);
    x.strokeStyle = "rgba(255,42,84,0.6)"; x.lineWidth = 2; x.stroke();

    mapAnimId = requestAnimationFrame(draw);
  };

  if (mapAnimId) cancelAnimationFrame(mapAnimId);
  draw();
}

/* Quick View Modal */
function openQuickView(id) {
  const p = find(id); if (!p) return;
  const modal = document.getElementById("quickModal");
  const modalBody = document.getElementById("modalBody");

  modalBody.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;align-items:center">
      <div id="modalStage" style="aspect-ratio:1;max-height:280px;display:grid;place-items:center;background:var(--bg-raise);border-radius:18px"></div>
      <div>
        <div class="mono" style="color:var(--accent-red);margin-bottom:6px">${p.origin}</div>
        <h2 style="margin-bottom:10px">${p.name}</h2>
        <p style="margin-bottom:14px;font-size:14.5px">${p.lede}</p>
        <div class="price" style="font-size:26px;margin-bottom:18px;font-family:var(--font-mono);color:var(--accent-red)">${money(p.price)}</div>
        <div style="display:flex;gap:12px;align-items:center">
          <button class="solid" data-add="${p.id}"><span>Add to Cart</span></button>
          <a class="ul" href="#/p/${p.id}" onclick="closeQuickView()">Full Specs →</a>
        </div>
      </div>
    </div>
  `;
  modal.classList.add("open");
  document.body.classList.add("locked");

  const stage = document.getElementById("modalStage");
  stage.innerHTML = object3d(p, 200);
  grip(stage);
}
function closeQuickView() {
  document.getElementById("quickModal").classList.remove("open");
  document.body.classList.remove("locked");
}
document.getElementById("modalClose").addEventListener("click", closeQuickView);

/* Cart Drawer */
const drawer = document.getElementById("drawer"),
      scrim = document.getElementById("scrim"),
      dinner = document.getElementById("drawerinner");

function drawCart(){
  const totalCount = cart.reduce((t,l) => t + l.n, 0);
  document.getElementById("cartlink").textContent = `Cart (${totalCount})`;

  if(!cart.length){
    dinner.innerHTML = `<div class="dr-top"><h3>Shopping Cart</h3>
      <button class="ul" id="drclose">Close</button></div>
      <div class="dr-body"><div style="text-align:center;padding:60px 10px;color:var(--text-dim)">
      <h3 style="margin-bottom:8px">Your Cart is Empty</h3>
      <p class="mono">Add items to view your selection.</p></div></div>`;
    return;
  }

  const sub = cart.reduce((t,l) => t + find(l.id).price * l.n, 0);
  const discount = Math.round(sub * (discountPercent / 100));
  const finalSub = sub - discount;
  const ship = finalSub >= SITE.freeAbove ? 0 : SITE.shipping;
  const grandTotal = finalSub + ship;
  const progressPercent = Math.min(100, Math.round((sub / SITE.freeAbove) * 100));
  const diffToFree = SITE.freeAbove - sub;

  dinner.innerHTML = `
    <div class="dr-top"><h3>Shopping Cart</h3><button class="ul" id="drclose">Close</button></div>
    <div class="dr-body">
      <div class="shipping-progress">
        <div class="mono" style="display:flex;justify-content:space-between;color:var(--text-main);margin-bottom:4px">
          <span>${progressPercent >= 100 ? "🎉 FREE DELIVERY UNLOCKED" : `ADD ${money(diffToFree)} FOR FREE DELIVERY`}</span>
          <span>${progressPercent}%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${progressPercent}%"></div></div>
      </div>
      ${cart.map((l,i) => { const p = find(l.id); return `
      <div class="line">
        <div class="sq" style="background-image:${wrapper(p)}"></div>
        <div>
          <h3 style="font-size:15px">${p.name}</h3>
          <div class="origin mono">${p.origin}</div>
          <button class="ul" data-del="${p.id}" style="margin-top:6px">Remove</button>
        </div>
        <div>
          <div style="text-align:right;font-weight:600;font-family:var(--font-mono)">${money(p.price*l.n)}</div>
          <div class="mono" style="text-align:right;margin-top:4px">${l.n} × ${money(p.price)}</div>
        </div>
      </div>`; }).join("")}
    </div>
    <div class="dr-foot">
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Subtotal</span><span>${money(sub)}</span></div>
      ${discount ? `<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Discount (${discountPercent}%)</span><span style="color:var(--accent-emerald)">-${money(discount)}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;padding:4px 0"><span>Delivery</span><span>${ship ? money(ship) : "FREE"}</span></div>
      <div style="font-size:20px;font-weight:700;color:var(--accent-red);border-top:1px solid var(--border-rule);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between">
        <span>Total</span><span>${money(grandTotal)}</span>
      </div>
      <div class="promo-row">
        <input type="text" id="promoInput" placeholder="Promo code (e.g. SG10)" value="${discountPercent ? 'SG10 Applied' : ''}">
        <button class="promo-btn" id="applyPromo">Apply</button>
      </div>
      <button class="solid wide" style="margin-top:14px" onclick="alert('Proceeding to Secure Checkout...')">
        <span>🔒 Proceed to Checkout</span>
      </button>
    </div>`;
}

const openCart  = () => { drawCart(); drawer.classList.add("open"); scrim.classList.add("open"); document.body.classList.add("locked"); sound.playTone(700, 0.05); };
const closeCart = () => { drawer.classList.remove("open"); scrim.classList.remove("open"); document.body.classList.remove("locked"); };
document.getElementById("cartlink").addEventListener("click", openCart);
scrim.addEventListener("click", closeCart);

/* Mobile Drawer Menu */
function toggleMobileMenu() {
  document.getElementById("mobileNav").classList.toggle("open");
}
function closeMobileMenu() {
  document.getElementById("mobileNav").classList.remove("open");
}
document.getElementById("menuToggle").addEventListener("click", toggleMobileMenu);

/* Add to Cart */
function add(id, n = 1, from){
  const line = cart.find(l => l.id === id);
  line ? line.n += n : cart.push({id, n});
  drawCart();
  sound.playSuccess();
}

/* Event Delegates */
document.addEventListener("click", e => {
  if(e.target.closest("#drclose")) { closeCart(); return; }

  const pin = e.target.closest("[data-pin]");
  if(pin){
    const est = ESTATES.find(est => est.id === pin.dataset.pin);
    const p = find(pin.dataset.pin);
    if (est && p) {
      document.getElementById("toastLocation").textContent = est.label;
      document.getElementById("toastProduct").textContent = p.name;
      document.getElementById("toastLink").href = "#/p/" + p.id;
      document.getElementById("pinToast").classList.add("open");
      sound.playTone(600, 0.04);
    }
    return;
  }

  const quick = e.target.closest("[data-quick]");
  if(quick){ openQuickView(quick.dataset.quick); return; }

  const btn = e.target.closest("[data-add]");
  if(btn){
    const n = btn.dataset.useq ? +document.getElementById("q").textContent : 1;
    add(btn.dataset.add, n, btn);
    return;
  }
  const q = e.target.closest("[data-q]");
  if(q){
    const el = document.getElementById("q");
    el.textContent = Math.max(1, +el.textContent + +q.dataset.q);
    sound.playTone(500, 0.03);
    return;
  }
  const del = e.target.closest("[data-del]");
  if(del){ cart = cart.filter(l => l.id !== del.dataset.del); drawCart(); sound.playTone(300, 0.05); }

  const pill = e.target.closest("[data-cat]");
  if(pill){
    activeCategory = pill.dataset.cat;
    render();
    sound.playTone(600, 0.04);
  }

  if (e.target.id === 'applyPromo') {
    const val = document.getElementById("promoInput").value.trim().toUpperCase();
    if (val === 'SG10' || val === 'SINGAPORE10') {
      discountPercent = 10;
      drawCart();
      sound.playSuccess();
    }
  }
});

/* Realtime Search Handler */
document.addEventListener("input", e => {
  if (e.target.id === 'searchInput') {
    searchQuery = e.target.value;
    const grid = document.querySelector(".grid");
    if (grid) {
      grid.innerHTML = getFilteredProducts().map(cardHTML).join("");
      mountObjects();
      reveal();
    }

});

/* Controls */
document.getElementById("currBtn").addEventListener("click", () => {
  currencyMode = currencyMode === 'INR' ? 'SGD' : 'INR';
  document.getElementById("currBtn").textContent = currencyMode === 'INR' ? '₹ INR' : 'S$ SGD';
  render();
  sound.playTone(650, 0.05);
});

document.getElementById("themeBtn").addEventListener("click", () => {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const newTheme = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", newTheme);
  document.getElementById("themeBtn").textContent = newTheme === "dark" ? "🌙" : "☀️";
  sound.playTone(700, 0.05);
});

document.getElementById("soundBtn").addEventListener("click", () => {
  sound.enabled = !sound.enabled;
  document.getElementById("soundBtn").textContent = sound.enabled ? "🔊 Enabled" : "🔇 Muted";
});

/* Router */
function render(){
  closeMobileMenu();
  const path = (location.hash.slice(1) || "/").split("?")[0];
  const seg = path.split("/").filter(Boolean);
  if(!seg.length)                   app.innerHTML = home();
  else if(seg[0] === "shop")        app.innerHTML = shop();
  else if(seg[0] === "map")         app.innerHTML = mapPage();
  else if(seg[0] === "p" && seg[1]) app.innerHTML = pdp(seg[1]);
  else                              app.innerHTML = notfound();

  window.scrollTo(0,0);
  document.querySelectorAll("nav a[data-r]").forEach(a =>
    a.classList.toggle("on", a.dataset.r === "/" + (seg[0] || "")));

  reveal(); paintMap(); mountObjects(); statementScroll();
}

function mountObjects(){
  document.querySelectorAll(".cell[data-mini]").forEach(cell => {
    const p = find(cell.dataset.mini);
    cell.innerHTML = object3d(p, cell.clientWidth * .72 || 160);
    grip(cell, {idle:false, ry:-20, rx:6});
  });
  const hs = document.getElementById("heroStage");
  if(hs){
    const p = find(hs.dataset.mini);
    hs.insertAdjacentHTML("afterbegin", object3d(p, hs.clientWidth * .62 || 220));
    grip(hs);
  }
  const bs = document.getElementById("bigStage");
  if(bs){
    const p = find(bs.dataset.mini);
    bs.innerHTML = object3d(p, bs.clientWidth * .68 || 260);
    grip(bs);
  }
}

let io;
function reveal(){
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
  }), {threshold:.05});
  document.querySelectorAll(".rv").forEach((el,i) => {
    el.style.transitionDelay = Math.min(i,3) * 70 + "ms";
    io.observe(el);
  });
}

function statementScroll(){
  const el = document.getElementById("statement");
  if(!el || reduce) return;
  const ws = [...el.querySelectorAll("w")];
  const apply = () => {
    const r = el.getBoundingClientRect(), vh = innerHeight;
    const k = (vh * .75 - r.top) / (r.height + vh * .25);
    const upto = Math.round(Math.max(0, Math.min(1, k)) * ws.length);
    ws.forEach((w,i) => w.classList.toggle("lit", i < upto));
  };
  window.addEventListener("scroll", () => requestAnimationFrame(apply), {passive:true});
  apply();
}

/* Mouse Glow Follower */
window.addEventListener("mousemove", e => {
  const blob = document.getElementById("bgGlowBlob");
  if (blob) {
    blob.style.transform = `translate(${e.clientX - window.innerWidth/2}px, ${e.clientY - 100}px)`;
  }
});

let lastY = 0;
window.addEventListener("scroll", () => {
  const hd = document.getElementById("hd"), y = scrollY;
  hd.classList.toggle("stuck", y > 8);
  lastY = y;
}, {passive:true});

document.getElementById("yr").textContent = new Date().getFullYear();
drawCart();
window.addEventListener("hashchange", render);
render();
</script>
